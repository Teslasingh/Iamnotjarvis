<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearSpeak • Local TTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .history-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .history-card:hover { transform: translateY(-2px); box-shadow: 0 0 18px rgba(120, 72, 35, 0.18); }
        .tail-text { scrollbar-width: thin; scrollbar-color: #8b5e3c #f8f2e9; }
        .tail-text::-webkit-scrollbar { width: 6px; }
        .tail-text::-webkit-scrollbar-thumb { background: #8b5e3c; border-radius: 20px; }
        .cyber-bg {
            background: radial-gradient(circle at top left, rgba(175, 122, 77, 0.16), transparent 42%),
                        radial-gradient(circle at top right, rgba(222, 201, 172, 0.2), transparent 46%),
                        #fdfaf5;
        }
        .neon-border { border-color: rgba(141, 99, 64, 0.35); }
        .neon-text { color: #6b3f22; text-shadow: 0 0 10px rgba(180, 132, 93, 0.22); }
        .neon-pink { color: #7a4e2d; }
        .neon-card { background: rgba(255, 251, 244, 0.94); backdrop-filter: blur(3px); }
        .curve-btn { border-radius: 14px; }
        .hl {
            background: rgba(139, 94, 60, 0.20);
            border: 1px solid rgba(139, 94, 60, 0.35);
            border-radius: 8px;
            padding: 0 2px;
        }
        [class*="bg-fuchsia"], [class*="bg-violet"], [class*="bg-cyan"] { background-color: #8b5e3c !important; }
        [class*="hover:bg-fuchsia"]:hover, [class*="hover:bg-violet"]:hover, [class*="hover:bg-cyan"]:hover { background-color: #6f4a2f !important; }
        [class*="text-fuchsia"], [class*="text-cyan"], [class*="text-violet"] { color: #6f4a2f !important; }
        [class*="border-fuchsia"], [class*="border-cyan"] { border-color: #c8b49e !important; }
        input::placeholder, textarea::placeholder { color: #9a7b63; }
    </style>
</head>
<body class="cyber-bg text-[#4e342e] min-h-screen">
    <div class="max-w-screen-2xl mx-auto">
        <!-- HEADER -->
        <header class="border-b neon-border bg-[#f5ece0]/95 sticky top-0 z-50">
            <div class="px-4 sm:px-8 py-4 sm:py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div class="flex items-center gap-x-4">
                    <div class="w-10 h-10 bg-[#8b5e3c] border border-[#c8b49e] rounded-2xl flex items-center justify-center text-2xl">🔊</div>
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold tracking-tighter">ClearSpeak</h1>
                        <p class="text-xs text-fuchsia-300/80 -mt-1">Local • Private • Cross-device</p>
                    </div>
                </div>
                <div class="flex items-center gap-x-3 sm:gap-x-6 text-sm w-full sm:w-auto justify-between sm:justify-end"></div>
            </div>
        </header>

        <div class="flex flex-col gap-4 sm:gap-6">
            <!-- LEFT: EDITOR -->
            <div class="w-full neon-card border neon-border rounded-3xl flex flex-col">
                <div class="p-4 sm:p-8 flex-1 flex flex-col">
                    <div class="mb-6">
                        <h2 class="text-xl font-semibold flex items-center gap-x-3">
                            <i class="fa-solid fa-pen-nib"></i>
                            Text Editor
                        </h2>
                        <p class="text-fuchsia-200/75 text-sm">Write • Paste • Speak instantly or save</p>
                    </div>

                    <textarea id="input-text" 
                              class="flex-1 min-h-[220px] bg-[#fffaf2] border border-[#c8b49e] focus:border-[#8b5e3c] rounded-3xl p-4 sm:p-7 text-base sm:text-lg resize-none outline-none tail-text overflow-y-auto"
                              placeholder="Paste or type anything here...&#10;Then click Speak Now or Save to History"></textarea>

                    <!-- CONTROLS -->
                    <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <!-- Voice -->
                        <div>
                            <label class="block text-xs font-medium text-fuchsia-300 mb-2 tracking-widest">VOICE</label>
                            <select id="voice-select"
                                    class="w-full bg-[#fffaf2] border border-[#c8b49e] rounded-2xl px-5 py-4 text-sm focus:outline-none focus:border-[#8b5e3c]">
                            </select>
                        </div>

                        <!-- Speed -->
                        <div>
                            <div class="flex justify-between text-xs font-medium text-fuchsia-300 mb-2">
                                <span>SPEED</span>
                                <span id="rate-val" class="font-mono text-cyan-300">1.0×</span>
                            </div>
                            <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1"
                                   class="w-full accent-cyan-400">
                        </div>

                        <!-- Pitch -->
                        <div>
                            <div class="flex justify-between text-xs font-medium text-fuchsia-300 mb-2">
                                <span>PITCH</span>
                                <span id="pitch-val" class="font-mono text-cyan-300">1.0</span>
                            </div>
                            <input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1"
                                   class="w-full accent-cyan-400">
                        </div>

                        <!-- Volume -->
                        <div>
                            <div class="flex justify-between text-xs font-medium text-fuchsia-300 mb-2">
                                <span>VOLUME</span>
                                <span id="volume-val" class="font-mono text-cyan-300">100%</span>
                            </div>
                            <input type="range" id="volume" min="0" max="1" step="0.05" value="1"
                                   class="w-full accent-cyan-400">
                        </div>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="mt-auto pt-8 grid grid-cols-3 gap-4">
                        <button id="transport-btn" onclick="handleTransport()"
                                title="Speak / Pause / Resume"
                                class="curve-btn bg-[#d9c2aa] hover:bg-[#cdb092] transition-all h-14 sm:h-16 text-lg font-semibold text-[#4e342e] flex items-center justify-center">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button id="stop-btn" onclick="stopSpeech()"
                                title="Stop"
                                class="curve-btn bg-[#d9c2aa] hover:bg-[#cdb092] transition-all h-14 sm:h-16 text-lg font-semibold text-[#4e342e] flex items-center justify-center">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                        <button onclick="saveCurrentText(event)" 
                                title="Save"
                                class="curve-btn bg-[#d9c2aa] hover:bg-[#cdb092] transition-all h-14 sm:h-16 text-lg font-semibold text-[#4e342e] flex items-center justify-center">
                            <i class="fa-solid fa-floppy-disk"></i>
                        </button>
                    </div>

                    <div id="now-speaking" class="mt-4 text-xs text-[#7a5b45] leading-relaxed"></div>
                </div>
            </div>

            <!-- RIGHT: HISTORY -->
            <div class="w-full neon-card border neon-border rounded-3xl flex flex-col min-h-[50vh]">
                <div id="history-container" class="flex-1 overflow-y-auto p-4 sm:p-8 space-y-6 tail-text">
                    <!-- Populated by JS -->
                </div>

                <div class="p-4 sm:p-8 border-t neon-border bg-[#f5ece0]/95 text-center text-xs text-[#7a5b45]">
                    Saved texts persist on this computer.<br>
                    Open <span class="font-mono neon-text">http://YOUR-IP:5000</span> on phone/laptop to listen
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====================== CONFIG ======================
        let voices = [];
        let currentHistory = [];
        let activeHistoryId = null;
        let speechSession = null; // { source: 'editor'|'history', historyId?: number, normalized: string, cue: Array<{text:string,start:number}>, activeCueStart: number, globalIndex: number }
        let ttsWatchdog = null;
        const synth = window.speechSynthesis || null;
        const SETTINGS_KEY = "clearspeak_settings_v1";
        const TTS_CHUNK_SIZE = 220;

        // ====================== VOICES ======================
        function populateVoices() {
            if (!synth) return;
            voices = synth.getVoices();
            const select = document.getElementById('voice-select');
            const selectedVoiceURI = select.value || select.dataset.savedVoiceUri || "";
            select.innerHTML = `<option value="">Default System Voice</option>`;
            
            voices.forEach((voice) => {
                const opt = document.createElement('option');
                opt.value = voice.voiceURI;
                opt.textContent = `${voice.name} (${voice.lang}) ${voice.default ? '★' : ''}`;
                select.appendChild(opt);
            });

            if (selectedVoiceURI && voices.some(v => v.voiceURI === selectedVoiceURI)) {
                select.value = selectedVoiceURI;
            }
            updateTransportButtons();
        }

        function loadSettings() {
            try {
                const raw = localStorage.getItem(SETTINGS_KEY);
                if (!raw) return;
                const settings = JSON.parse(raw);

                document.getElementById('rate').value = settings.rate ?? 1;
                document.getElementById('pitch').value = settings.pitch ?? 1;
                document.getElementById('volume').value = settings.volume ?? 1;

                if (settings.voiceURI) {
                    document.getElementById('voice-select').dataset.savedVoiceUri = settings.voiceURI;
                }
            } catch (err) {
                console.warn("Could not load saved settings", err);
            }
        }

        function saveSettings() {
            try {
                const payload = {
                    voiceURI: document.getElementById('voice-select').value,
                    rate: parseFloat(document.getElementById('rate').value),
                    pitch: parseFloat(document.getElementById('pitch').value),
                    volume: parseFloat(document.getElementById('volume').value)
                };
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
            } catch (err) {
                console.warn("Could not save settings", err);
            }
        }

        // ====================== SLIDERS ======================
        function updateSliderLabels() {
            document.getElementById('rate-val').textContent = 
                parseFloat(document.getElementById('rate').value).toFixed(1) + '×';
            document.getElementById('pitch-val').textContent = 
                parseFloat(document.getElementById('pitch').value).toFixed(1);
            document.getElementById('volume-val').textContent = 
                Math.round(parseFloat(document.getElementById('volume').value) * 100) + '%';
        }

        function updateTransportButtons() {
            const btn = document.getElementById('transport-btn');
            const stopBtn = document.getElementById('stop-btn');
            if (!btn || !stopBtn || !synth) return;
            const isActive = synth.speaking || synth.paused || synth.pending;

            if (synth.paused) {
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            } else if (synth.speaking || synth.pending) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }

            stopBtn.disabled = !isActive;
            stopBtn.classList.toggle('opacity-50', !isActive);
            stopBtn.classList.toggle('cursor-not-allowed', !isActive);
        }

        function syncTransportUI() {
            updateTransportButtons();
            renderHistory();
            renderNowSpeaking();
        }

        function escapeHtml(text) {
            return (text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getWordRange(text, index) {
            const len = text.length;
            if (!len) return { start: 0, end: 0 };
            let i = Math.max(0, Math.min(index, len - 1));

            // If we land on whitespace, nudge to nearest word char.
            const isWord = (ch) => /[A-Za-z0-9]/.test(ch);
            if (!isWord(text[i])) {
                let left = i;
                let right = i;
                while (left > 0 && !isWord(text[left])) left--;
                while (right < len - 1 && !isWord(text[right])) right++;
                i = isWord(text[left]) ? left : (isWord(text[right]) ? right : i);
            }

            let start = i;
            let end = i + 1;
            while (start > 0 && isWord(text[start - 1])) start--;
            while (end < len && isWord(text[end])) end++;
            return { start, end };
        }

        function buildHighlightedExcerpt(text, globalIndex) {
            if (!text) return "";
            const { start, end } = getWordRange(text, globalIndex || 0);
            const windowSize = 70;
            const left = Math.max(0, start - windowSize);
            const right = Math.min(text.length, end + windowSize);

            const prefix = escapeHtml(text.slice(left, start));
            const word = escapeHtml(text.slice(start, end));
            const suffix = escapeHtml(text.slice(end, right));

            const leftEllipsis = left > 0 ? "…" : "";
            const rightEllipsis = right < text.length ? "…" : "";
            return `${leftEllipsis}${prefix}<span class="hl">${word || ""}</span>${suffix}${rightEllipsis}`;
        }

        function renderNowSpeaking() {
            const now = document.getElementById('now-speaking');
            if (!now) return;

            if (!speechSession || (!synth || (!synth.speaking && !synth.pending && !synth.paused))) {
                now.textContent = "";
                return;
            }

            const excerpt = buildHighlightedExcerpt(speechSession.normalized, speechSession.globalIndex || 0);
            now.innerHTML = excerpt ? `Reading: ${excerpt}` : "";
        }

        function startWatchdog() {
            stopWatchdog();
            // Chrome can "stall" TTS; this keeps the engine active for long reads.
            ttsWatchdog = setInterval(() => {
                if (!synth) return;
                if ((synth.speaking || synth.pending) && !synth.paused) {
                    try {
                        synth.pause();
                        synth.resume();
                    } catch (e) {
                        // ignore
                    }
                }
            }, 9000);
        }

        function stopWatchdog() {
            if (ttsWatchdog) clearInterval(ttsWatchdog);
            ttsWatchdog = null;
        }

        function normalizeSpeechText(text) {
            let out = (text || "").trim();
            if (!out) return "";

            const replacements = [
                [/\be\.g\./gi, "for example"],
                [/\bi\.e\./gi, "that is"],
                [/\bMr\./g, "Mister"],
                [/\bMrs\./g, "Misses"],
                [/\bDr\./g, "Doctor"],
                [/\bvs\./gi, "versus"],
                [/&/g, " and "]
            ];

            replacements.forEach(([pattern, replacement]) => {
                out = out.replace(pattern, replacement);
            });

            out = out
                .replace(/([,.!?;:])(?!\s|$)/g, "$1 ")
                .replace(/\s+/g, " ")
                .trim();

            return out;
        }

        function splitTextIntoChunks(text, maxChars = TTS_CHUNK_SIZE) {
            if (!text) return [];

            const chunks = [];
            const sentenceParts = text.match(/[^.!?]+[.!?]*/g) || [text];
            let current = "";

            const pushChunk = (value) => {
                const clean = value.trim();
                if (clean) chunks.push(clean);
            };

            const splitLongSentence = (sentence) => {
                const segments = sentence.split(/([,;:])/).reduce((acc, part, idx, arr) => {
                    if (idx % 2 === 0) {
                        const punct = arr[idx + 1] || "";
                        const combined = `${part}${punct}`.trim();
                        if (combined) acc.push(combined);
                    }
                    return acc;
                }, []);

                const finalSegments = segments.length ? segments : [sentence];
                finalSegments.forEach((segment) => {
                    if (segment.length <= maxChars) {
                        pushChunk(segment);
                        return;
                    }

                    const words = segment.split(/\s+/);
                    let wordChunk = "";
                    words.forEach((word) => {
                        const test = `${wordChunk} ${word}`.trim();
                        if (test.length > maxChars) {
                            pushChunk(wordChunk);
                            wordChunk = word;
                        } else {
                            wordChunk = test;
                        }
                    });
                    pushChunk(wordChunk);
                });
            };

            sentenceParts.forEach((sentence) => {
                const test = `${current} ${sentence}`.trim();
                if (test.length <= maxChars) {
                    current = test;
                    return;
                }

                pushChunk(current);
                if (sentence.length > maxChars) {
                    splitLongSentence(sentence);
                    current = "";
                } else {
                    current = sentence.trim();
                }
            });

            pushChunk(current);
            return chunks;
        }

        function getPreferredVoice() {
            const select = document.getElementById('voice-select');
            const selectedURI = select?.value || "";
            if (selectedURI) {
                return voices.find(v => v.voiceURI === selectedURI) || null;
            }

            const language = (navigator.language || "en-US").toLowerCase();
            const isEnglish = language.startsWith("en");

            const scoreVoice = (voice) => {
                const name = `${voice.name} ${voice.lang}`.toLowerCase();
                let score = 0;
                if (voice.default) score += 10;
                if (name.includes("neural") || name.includes("natural")) score += 20;
                if (name.includes("enhanced") || name.includes("premium")) score += 10;
                if (name.includes("microsoft") || name.includes("google")) score += 8;
                if (isEnglish && name.includes("en")) score += 10;
                if (name.includes(language.split("-")[0])) score += 8;
                return score;
            };

            return [...voices].sort((a, b) => scoreVoice(b) - scoreVoice(a))[0] || null;
        }

        function handleTransport() {
            if (!synth) return;
            if (synth.paused) {
                synth.resume();
            } else if (synth.speaking || synth.pending) {
                synth.pause();
            } else {
                speakCurrent();
            }
            syncTransportUI();
        }

        function stopSpeech() {
            if (!synth || (!synth.speaking && !synth.paused && !synth.pending)) return;
            synth.cancel();
            activeHistoryId = null;
            speechSession = null;
            stopWatchdog();
            syncTransportUI();
        }

        function buildSpeechCue(normalizedText) {
            const chunks = splitTextIntoChunks(normalizedText);
            const cue = [];
            let cursor = 0;

            chunks.forEach((chunk) => {
                const idx = normalizedText.indexOf(chunk, cursor);
                const start = idx >= 0 ? idx : cursor;
                cue.push({ text: chunk, start });
                cursor = start + chunk.length;
            });

            return cue;
        }

        // ====================== SPEAK ======================
        function speak(text, opts = {}) {
            if (!synth || !text || !text.trim()) return;
            
            // Reset old queue and rebuild speech in sentence chunks for smoother delivery.
            if (synth.speaking || synth.pending || synth.paused) synth.cancel();

            const normalized = normalizeSpeechText(text);
            const cue = buildSpeechCue(normalized);
            if (!cue.length) return;

            speechSession = {
                source: opts.source || 'editor',
                historyId: opts.historyId ?? null,
                normalized,
                cue,
                activeCueStart: 0,
                globalIndex: 0
            };

            const selectedVoice = getPreferredVoice();
            const rate = parseFloat(document.getElementById('rate').value);
            const pitch = parseFloat(document.getElementById('pitch').value);
            const volume = parseFloat(document.getElementById('volume').value);

            cue.forEach((item, index) => {
                const utterance = new SpeechSynthesisUtterance(item.text);
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.rate = rate;
                utterance.pitch = pitch;
                utterance.volume = volume;

                utterance.onboundary = (e) => {
                    if (!speechSession) return;
                    if (typeof e.charIndex === "number") {
                        speechSession.activeCueStart = item.start;
                        speechSession.globalIndex = item.start + e.charIndex;
                        renderNowSpeaking();
                    }
                };

                if (index === 0) {
                    utterance.onstart = () => {
                        startWatchdog();
                        syncTransportUI();
                    };
                }
                if (index === cue.length - 1) {
                    utterance.onend = () => {
                        activeHistoryId = null;
                        speechSession = null;
                        stopWatchdog();
                        syncTransportUI();
                    };
                    utterance.onerror = () => {
                        activeHistoryId = null;
                        speechSession = null;
                        stopWatchdog();
                        syncTransportUI();
                    };
                }

                synth.speak(utterance);
            });
            syncTransportUI();
        }

        function speakCurrent() {
            const text = document.getElementById('input-text').value;
            activeHistoryId = null;
            speak(text, { source: 'editor' });
        }

        // ====================== SAVE ======================
        async function saveCurrentText(evt) {
            const text = document.getElementById('input-text').value.trim();
            if (!text) {
                alert("Nothing to save! Type something first.");
                return;
            }

            try {
                const res = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    currentHistory = data.history;
                    renderHistory();
                    // Visual feedback
                    const btn = evt?.currentTarget;
                    if (!btn) return;
                    const origText = btn.innerHTML;
                    btn.innerHTML = `<i class="fa-solid fa-check"></i>`;
                    setTimeout(() => btn.innerHTML = origText, 1200);
                }
            } catch (err) {
                console.error(err);
                alert("Could not save. Is the server running?");
            }
        }

        // ====================== HISTORY ======================
        async function loadHistory() {
            try {
                const res = await fetch('/history');
                currentHistory = await res.json();
                renderHistory();
            } catch (err) {
                console.error(err);
            }
        }

        function renderHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            if (currentHistory.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center py-20">
                        <div class="text-6xl mb-6 opacity-30">📭</div>
                        <p class="text-cyan-300 text-lg">No saved conversations yet</p>
                        <p class="text-fuchsia-300/75 text-sm mt-2">Save your first text above</p>
                    </div>`;
                return;
            }

            currentHistory.forEach(entry => {
                const card = document.createElement('div');
                card.className = `history-card neon-card border border-fuchsia-500/30 rounded-3xl p-6 group`;
                
                const date = new Date(entry.timestamp);
                const fullText = entry.text || '';

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-xs font-mono text-fuchsia-300/70">
                            ${date.toLocaleDateString('en-US', {month:'short', day:'numeric'})} 
                            ${date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                        </div>
                        <div class="flex gap-2">
                            <button onclick="loadToEditor(${entry.id}); event.stopImmediatePropagation()" title="Load to editor"
                                    class="curve-btn px-3 py-1.5 text-xs bg-[#e7d7c7] hover:bg-[#dbc7b2] text-[#4e342e] flex items-center gap-x-1">
                                <i class="fa-solid fa-arrow-up"></i>
                            </button>
                            <button onclick="deleteEntry(${entry.id}); event.stopImmediatePropagation()" title="Delete"
                                    class="curve-btn px-3 py-1.5 text-xs bg-[#d9c2aa] hover:bg-[#cdb092] text-[#4e342e]">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-cyan-100 leading-relaxed text-[15px] max-h-32 overflow-y-auto tail-text pr-1">
                        ${fullText.replace(/\n/g, '<br>')}
                    </div>
                    
                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button onclick="handleHistoryTransport(${entry.id}); event.stopImmediatePropagation()" 
                                title="Play / Pause / Resume"
                                class="curve-btn bg-[#d9c2aa] hover:bg-[#cdb092] py-3 font-medium text-[#4e342e] flex items-center justify-center transition">
                            <i class="fa-solid ${
                                activeHistoryId === entry.id
                                    ? (synth.paused ? 'fa-play' : ((synth.speaking || synth.pending) ? 'fa-pause' : 'fa-play'))
                                    : 'fa-play'
                            }"></i>
                        </button>
                        <button onclick="stopHistorySpeech(${entry.id}); event.stopImmediatePropagation()"
                                title="Stop"
                                class="curve-btn bg-[#d9c2aa] hover:bg-[#cdb092] py-3 font-medium text-[#4e342e] flex items-center justify-center transition">
                            <i class="fa-solid fa-stop"></i>
                        </button>
                    </div>

                    <div class="mt-3 text-xs text-[#7a5b45]" data-now="${entry.id}">
                        ${activeHistoryId === entry.id && speechSession && speechSession.source === 'history'
                            ? `Reading: ${buildHighlightedExcerpt(speechSession.normalized, speechSession.globalIndex || 0)}`
                            : ''
                        }
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleHistoryTransport(id) {
            const entry = currentHistory.find(e => e.id === id);
            if (!entry || !synth) return;

            if (activeHistoryId === id && synth.paused) {
                synth.resume();
            } else if (activeHistoryId === id && (synth.speaking || synth.pending)) {
                synth.pause();
            } else {
                activeHistoryId = id;
                speak(entry.text, { source: 'history', historyId: id });
            }

            syncTransportUI();
        }

        function stopHistorySpeech(id) {
            if (!synth || (!synth.speaking && !synth.paused && !synth.pending)) return;
            if (activeHistoryId !== id) return;
            stopSpeech();
        }

        function playHistory(id) {
            const entry = currentHistory.find(e => e.id === id);
            if (entry) speak(entry.text);
        }

        function loadToEditor(id) {
            const entry = currentHistory.find(e => e.id === id);
            if (entry) {
                document.getElementById('input-text').value = entry.text;
                document.getElementById('input-text').focus();
            }
        }

        async function deleteEntry(id) {
            if (!confirm('Delete this saved conversation?')) return;
            
            try {
                await fetch(`/delete/${id}`, { method: 'DELETE' });
                loadHistory();
            } catch (err) {
                alert("Delete failed");
            }
        }

        async function clearAllHistory() {
            if (!confirm('⚠️ Delete ALL 10 saved conversations permanently?')) return;
            
            try {
                await fetch('/clear', { method: 'DELETE' });
                loadHistory();
            } catch (err) {
                alert("Clear failed");
            }
        }

        // ====================== INIT ======================
        window.onload = () => {
            // Tailwind script already loaded
            
            if (!synth) {
                alert("Your browser does not support Text-to-Speech.");
                return;
            }

            // Load saved voice/speed/pitch/volume settings before voice list rendering.
            loadSettings();

            // Populate voices
            populateVoices();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = populateVoices;
            }
            setTimeout(populateVoices, 800);

            // Sliders
            const sliders = ['rate', 'pitch', 'volume'];
            sliders.forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    updateSliderLabels();
                    saveSettings();
                });
            });
            document.getElementById('voice-select').addEventListener('change', saveSettings);
            updateSliderLabels();
            updateTransportButtons();

            // Keyboard shortcut: Ctrl/Cmd + Enter = Speak Now
            document.getElementById('input-text').addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    speakCurrent();
                }
            });

            // Load history
            loadHistory();

            // Auto-refresh history every 8 seconds (in case another device saves)
            setInterval(() => {
                fetch('/history')
                    .then(r => r.json())
                    .then(data => {
                        if (JSON.stringify(data) !== JSON.stringify(currentHistory)) {
                            currentHistory = data;
                            renderHistory();
                        }
                    });
            }, 8000);

            console.log('%cClearSpeak ready! Access from any device on your WiFi.', 'color:#22d3ee; font-size:13px');
        };
    </script>
</body>
</html>
