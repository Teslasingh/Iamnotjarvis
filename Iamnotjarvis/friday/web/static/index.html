<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Friday</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="dot"></span>
          <span>Friday</span>
          <span class="sub">agent</span>
        </div>
        <div class="status" id="status">Idle</div>
        <div class="actions">
          <button type="button" class="btn ghost small-btn" id="btn-clear-log">Clear log</button>
        </div>
      </header>
      <main class="grid">
        <aside class="rail">
          <div class="panel-title">Shell jobs</div>
          <ul id="job-list" class="list"></ul>
        </aside>
        <section class="chat">
          <div class="panel-title">Chat</div>
          <p class="hint muted small">
            One agent: shell, files, and legacy codegen are tools the model chooses. Describe what you want in plain language.
          </p>
          <div id="chat-stream" class="messages"></div>
          <form id="chat-form" class="composer">
            <textarea id="chat-input" rows="3" placeholder="e.g. List files in the workdir, or run legacy codegen to build a calculator script…"></textarea>
            <button type="submit" class="btn primary" id="btn-send">Send</button>
          </form>
        </section>
        <section class="log">
          <div class="panel-title">Event log</div>
          <pre id="event-log" class="event-log"></pre>
        </section>
      </main>
    </div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
